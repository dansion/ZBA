<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>浙BA 2026 · 球队赛程</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="teams.css" />
</head>
<body class="page-schedule">
  <header>
    <div class="hbar">
      <a class="back" href="teams.html" title="返回积分榜">‹ 返回</a>
      <div class="htitle">
        <span id="team-logo" class="hlogo" aria-hidden="true" style="display:none"></span>
        <h1 id="team-title">球队赛程</h1>
      </div>
      <span id="team-count" class="hcount"></span>
    </div>
  </header>

  <div class="wrap">
    <div class="card matches" id="list">
      <div class="msg">正在加载赛程…</div>
    </div>
  </div>

  <p class="footer">
    数据更新 <code>2026-09-12</code> · 浙BA 2026 浙江省城市篮球联赛
  </p>

  <script src="data/data.js"></script>
  <script>
    (function () {
      var listEl = document.getElementById('list');
      var titleEl = document.getElementById('team-title');
      var countEl = document.getElementById('team-count');
      var logoEl = document.getElementById('team-logo');

      function esc(s) {
        return String(s).replace(/[&<>"]/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
      }

      // 队徽改用 CSS 背景渲染（teams.css 内嵌 base64）；键为 logos/ 文件名去扩展名（如 台州）
      function logoKey(logo) {
        return String(logo || '').replace(/^.*\//, '').replace(/\.png$/, '');
      }

      function logoImg(t, name) {
        return (t && t.logo)
          ? '<span class="mlogo" data-logo="' + esc(logoKey(t.logo)) + '" aria-label="' + esc(name) + '"></span>'
          : '<span class="mlogo"></span>';
      }

      function fail(html) { listEl.innerHTML = html; }

      if (typeof teamsData === 'undefined' || typeof scheduleData === 'undefined') {
        fail('<div class="msg error">未找到数据（teamsData / scheduleData 未定义）。' +
          '<br>请确认 <code>data/data.js</code> 与本页面一并存在且路径正确。</div>');
        return;
      }

      var params = new URLSearchParams(location.search);
      var teamName = (params.get('team') || '').trim();
      var groupName = (params.get('group') || '').trim();

      var teamMap = {};
      teamsData.forEach(function (t) { teamMap[t['名称']] = t; });

      // 按比赛时间升序排序（日期早的排前面）；同一时刻以场序作稳定 tie-breaker
      function byTime(a, b) {
        var ta = String(a['日期'] || '').split(' ')[0] + ' ' + (a['时间'] || '');
        var tb = String(b['日期'] || '').split(' ')[0] + ' ' + (b['时间'] || '');
        if (ta !== tb) return ta < tb ? -1 : 1;
        return a['场序'] - b['场序'];
      }

      // 渲染赛程列表；highlight 为需高亮的当前队名（小组模式传 null，不高亮任何队）
      function renderMatches(matches, highlight) {
        listEl.innerHTML = matches.map(function (m) {
          var home = teamMap[m['主场队']] || {};
          var away = teamMap[m['客场队']] || {};
          var isPlayed = m['主队得分'] != null && m['客队得分'] != null;

          var centerBottom = isPlayed
            ? '<div class="score">' + m['主队得分'] + ' : ' + m['客队得分'] + '</div>'
            : '<div class="venue">' + esc(home['主场场馆'] || '待定') + '</div>';

          var dparts = String(m['日期'] || '').split(' ');
          var dateStr = dparts[0] || '';
          var weekStr = dparts[1] || '';
          var timeStr = m['时间'] || '';

          return '<div class="match">' +
            '<div class="side home">' +
              logoImg(home, m['主场队']) +
              '<span class="mname' + (m['主场队'] === highlight ? ' me' : '') + '">' + esc(m['主场队']) + '</span>' +
            '</div>' +
            '<div class="center">' +
              '<div class="when"><span class="date">' + esc(dateStr) + '</span>' +
                '<span class="time">' + esc((weekStr + ' ' + timeStr).trim()) + '</span></div>' +
              centerBottom +
            '</div>' +
            '<div class="side away">' +
              '<span class="mname' + (m['客场队'] === highlight ? ' me' : '') + '">' + esc(m['客场队']) + '</span>' +
              logoImg(away, m['客场队']) +
            '</div>' +
          '</div>';
        }).join('');
      }

      // 小组模式：展示该组全部赛程（teams.html 组名链接进入）
      if (groupName) {
        var groupMatches = scheduleData.filter(function (m) {
          return m['组别'] === groupName;
        }).sort(byTime);

        if (!groupMatches.length) {
          titleEl.textContent = '未找到小组';
          fail('<div class="msg error">未找到「' + esc(groupName) + ' 组」的赛程。' +
            '<br><a href="teams.html">返回积分榜</a></div>');
          return;
        }

        var groupTeams = teamsData.filter(function (t) { return t['组别'] === groupName; }).length;
        document.title = groupName + '组 · 赛程 | 浙BA 2026';
        titleEl.textContent = groupName + '组';
        countEl.textContent = groupTeams + ' 队 · 共 ' + groupMatches.length + ' 场';
        renderMatches(groupMatches, null);
        return;
      }

      // 球队模式：展示某队全部赛程（teams.html 球队行链接进入）
      if (!teamName) {
        titleEl.textContent = '赛程查询';
        fail('<div class="msg">未指定球队或小组。请从 <a href="teams.html">积分榜</a> 点击球队或组名查看赛程。</div>');
        return;
      }

      var team = teamMap[teamName];
      if (!team) {
        titleEl.textContent = '未找到球队';
        fail('<div class="msg error">未找到名为「' + esc(teamName) + '」的球队。' +
          '<br><a href="teams.html">返回积分榜</a></div>');
        return;
      }

      // 设置页头
      document.title = teamName + ' · 赛程 | 浙BA 2026';
      titleEl.textContent = teamName;
      if (team.logo) { logoEl.setAttribute('data-logo', logoKey(team.logo)); logoEl.style.display = ''; }

      var matches = scheduleData.filter(function (m) {
        return m['主场队'] === teamName || m['客场队'] === teamName;
      }).sort(byTime);

      countEl.textContent = (team['组别'] ? team['组别'] + '组 · ' : '') + '共 ' + matches.length + ' 场';

      if (!matches.length) {
        fail('<div class="msg">该球队暂无赛程数据。</div>');
        return;
      }

      renderMatches(matches, teamName);
    })();
  </script>
</body>
</html>
