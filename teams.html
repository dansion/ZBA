<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>浙BA 2026 · 小组积分榜</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-teams">
  <header>
    <div class="hbar">
      <a class="back" href="index.html" title="返回首页">‹ 返回</a>
      <h1>浙BA 2026 · 小组积分榜</h1>
    </div>
  </header>

  <div class="wrap">
    <div class="groups" id="groups">
      <div class="msg">正在加载积分数据…</div>
    </div>
  </div>

  <p class="footer">
    数据更新 <code>2026-09-04</code> · 浙BA 2026 浙江省城市篮球联赛
  </p>

  <script src="data/data.js"></script>
  <script>
    (function () {
      var GROUP_ORDER = ['A', 'B', 'C', 'D'];
      var container = document.getElementById('groups');

      function esc(s) {
        return String(s).replace(/[&<>"]/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
      }

      function played(m) {
        return m['主队得分'] != null && m['客队得分'] != null;
      }

      // 依据比分累计每队数据：胜 2 分 / 负 1 分（篮球无平局）
      function computeStats(teams, schedule) {
        var stats = new Map();
        teams.forEach(function (t, i) {
          stats.set(t['名称'], {
            名称: t['名称'], 组别: t['组别'], logo: t['logo'], 原序: i,
            场: 0, 胜: 0, 负: 0, 积分: 0, 得分: 0, 失分: 0, 净胜: 0
          });
        });
        schedule.forEach(function (m) {
          if (!played(m)) return; // 未开赛
          var home = stats.get(m['主场队']), away = stats.get(m['客场队']);
          if (!home || !away) return;
          var hs = m['主队得分'], as = m['客队得分'];
          home.场++; away.场++;
          home.得分 += hs; home.失分 += as;
          away.得分 += as; away.失分 += hs;
          if (hs > as) { home.胜++; home.积分 += 2; away.负++; away.积分 += 1; }
          else if (as > hs) { away.胜++; away.积分 += 2; home.负++; home.积分 += 1; }
        });
        stats.forEach(function (s) { s.净胜 = s.得分 - s.失分; });
        return stats;
      }

      // 同分集群内，仅统计集群球队之间的对局（相互胜负）
      function headToHeadRank(cluster, schedule) {
        var names = {};
        cluster.forEach(function (t) { names[t.名称] = { 胜: 0 }; });
        schedule.forEach(function (m) {
          if (!played(m)) return;
          var home = m['主场队'], away = m['客场队'];
          if (!names[home] || !names[away]) return;
          if (m['主队得分'] > m['客队得分']) names[home].胜++;
          else if (m['客队得分'] > m['主队得分']) names[away].胜++;
        });
        return cluster.slice().sort(function (a, b) {
          var d = names[b.名称].胜 - names[a.名称].胜;   // 相互胜负
          if (d !== 0) return d;
          if (b.净胜 !== a.净胜) return b.净胜 - a.净胜; // 净胜分
          if (b.得分 !== a.得分) return b.得分 - a.得分; // 总得分
          return a.原序 - b.原序;                        // 稳定兜底
        });
      }

      // 组内排名：积分 → 相互胜负 → 净胜分 → 总得分
      function rankGroup(list, schedule) {
        var byPts = list.slice().sort(function (a, b) {
          return (b.积分 - a.积分) || (a.原序 - b.原序);
        });
        var out = [], i = 0;
        while (i < byPts.length) {
          var j = i;
          while (j + 1 < byPts.length && byPts[j + 1].积分 === byPts[i].积分) j++;
          var cluster = byPts.slice(i, j + 1);
          if (cluster.length === 1) out.push(cluster[0]);
          else headToHeadRank(cluster, schedule).forEach(function (t) { out.push(t); });
          i = j + 1;
        }
        return out;
      }

      function render(teams, schedule) {
        var stats = computeStats(teams, schedule);
        var groups = {};
        GROUP_ORDER.forEach(function (g) { groups[g] = []; });
        stats.forEach(function (s) {
          (groups[s.组别] = groups[s.组别] || []).push(s);
        });

        container.innerHTML = GROUP_ORDER.map(function (g) {
          var ranked = rankGroup(groups[g] || [], schedule);
          var rows = ranked.map(function (s, idx) {
            var rank = idx + 1;
            var logo = s.logo
              ? '<img class="logo" src="' + esc(s.logo) + '" alt="' + esc(s.名称) +
                '" loading="lazy" onerror="this.style.visibility=\'hidden\'">'
              : '<span class="logo"></span>';
            return '<a class="row team' + (rank <= 4 ? ' qualify' : '') + (idx % 2 === 1 ? ' alt' : '') + '" href="schedule.html?team=' + encodeURIComponent(s.名称) + '" title="查看 ' + esc(s.名称) + ' 赛程">' +
              '<span class="rank' + (rank <= 4 ? ' top' : '') + '">' + rank + '</span>' +
              logo +
              '<span class="name">' + esc(s.名称) + '</span>' +
              '<span class="pts">' + (s.积分 === 0 ? '-' : s.积分) + '</span>' +
            '</a>';
          }).join('');
          return '<section class="card group">' +
            '<h2 class="group-title"><a href="schedule.html?group=' + encodeURIComponent(g) + '" title="查看 ' + g + ' 组全部赛程">' + g + '组</a></h2>' +
            '<div class="row head"><span class="rank">#</span><span class="logo"></span>' +
              '<span class="name">球队</span><span class="pts">积分</span></div>' +
            rows +
          '</section>';
        }).join('');
      }

      function showError(msg) {
        container.innerHTML = '<div class="msg error">积分数据加载失败：' + esc(msg) +
          '<br>请确认 <code>data/data.js</code> 与本页面一并存在且路径正确。</div>';
      }

      if (typeof teamsData !== 'undefined' && typeof scheduleData !== 'undefined') {
        render(teamsData, scheduleData);
      } else {
        showError('未找到数据（teamsData / scheduleData 未定义）');
      }
    })();
  </script>
</body>
</html>
