<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>浙江篮球联赛 · 分组与赛程</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --group-a: #ef4444;
      --group-b: #f59e0b;
      --group-c: #10b981;
      --group-d: #8b5cf6;
      --radius: 16px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 10px 15px -3px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: white;
      padding: 48px 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 70% 30%, rgba(255,255,255,0.12) 0%, transparent 40%);
      pointer-events: none;
    }
    header h1 { font-size: 2rem; font-weight: 700; position: relative; }
    header p { margin-top: 8px; opacity: 0.9; position: relative; }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }
    .tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 32px 0;
    }
    .tab {
      padding: 10px 24px;
      border-radius: 999px;
      border: none;
      background: white;
      color: var(--text);
      font-weight: 500;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
    }
    .tab.active { background: var(--accent); color: white; }
    .tab:hover:not(.active) { background: var(--accent-light); color: var(--accent); }
    .section { display: none; animation: fadeIn 0.35s ease; }
    .section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .group-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .group-header {
      padding: 16px;
      color: white;
      font-weight: 700;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .group-header.A { background: var(--group-a); }
    .group-header.B { background: var(--group-b); }
    .group-header.C { background: var(--group-c); }
    .group-header.D { background: var(--group-d); }
    .team-list { padding: 12px; }
    .team-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 8px;
      border-radius: 12px;
      transition: background 0.15s ease;
    }
    .team-item:hover { background: #f9fafb; }
    .team-logo {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: contain;
      background: white;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.05);
      padding: 2px;
    }
    .team-info { flex: 1; min-width: 0; }
    .team-name { font-weight: 600; font-size: 0.95rem; }
    .team-venue { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: 20px 0 12px;
    }
    .filter-label { color: var(--muted); font-size: 0.9rem; }
    .filter-btn {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid #e5e7eb;
      background: white;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .filter-btn.active { background: var(--text); color: white; border-color: var(--text); }
    .filter-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

    .round-block { margin-bottom: 28px; }
    .round-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 20px 0 12px;
      padding-left: 12px;
      border-left: 4px solid var(--accent);
    }
    .schedule-list { display: grid; gap: 12px; }
    .match-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 16px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 16px;
    }
    .match-meta {
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
      min-width: 70px;
    }
    .match-meta .day { font-size: 1.05rem; font-weight: 700; color: var(--text); }
    .match-teams {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
    }
    .team-side {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }
    .team-side.away { justify-content: flex-end; flex-direction: row-reverse; text-align: right; }
    .team-side .team-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vs {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
      background: var(--bg);
      padding: 4px 10px;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .match-detail {
      font-size: 0.8rem;
      color: var(--muted);
      text-align: right;
      min-width: 120px;
    }
    .match-detail .venue {
      display: block;
      margin-top: 2px;
      color: var(--text);
      font-weight: 500;
    }
    .group-tag {
      display: inline-block;
      width: 22px;
      height: 22px;
      line-height: 22px;
      border-radius: 50%;
      text-align: center;
      font-size: 0.7rem;
      font-weight: 700;
      color: white;
      margin-left: 8px;
    }
    .group-tag.A { background: var(--group-a); }
    .group-tag.B { background: var(--group-b); }
    .group-tag.C { background: var(--group-c); }
    .group-tag.D { background: var(--group-d); }

    .empty { text-align: center; color: var(--muted); padding: 48px 0; }

    @media (max-width: 720px) {
      .match-card { grid-template-columns: 1fr; gap: 10px; }
      .match-meta { text-align: left; display: flex; gap: 12px; align-items: baseline; }
      .match-detail { text-align: left; }
      .team-side.away { flex-direction: row; text-align: left; }
      header h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>浙江篮球联赛</h1>
    <p>2026 赛季 · 分组情况与完整赛程</p>
  </header>

  <div class="container">
    <div class="tabs">
      <button class="tab active" data-target="groups">分组情况</button>
      <button class="tab" data-target="schedule">赛程安排</button>
    </div>

    <section id="groups" class="section active">
      <div id="groups-container" class="groups-grid"></div>
    </section>

    <section id="schedule" class="section">
      <div class="filter-bar">
        <span class="filter-label">筛选分组：</span>
        <button class="filter-btn active" data-group="all">全部</button>
        <button class="filter-btn" data-group="A">A组</button>
        <button class="filter-btn" data-group="B">B组</button>
        <button class="filter-btn" data-group="C">C组</button>
        <button class="filter-btn" data-group="D">D组</button>
      </div>
      <div id="schedule-container"></div>
    </section>
  </div>

  <script>
    const groupOrder = ['A', 'B', 'C', 'D'];
    const groupColorClass = { A: 'A', B: 'B', C: 'C', D: 'D' };

    async function loadData() {
      try {
        const [teamsRes, scheduleRes] = await Promise.all([
          fetch('data/teams.json'),
          fetch('data/schedule.json')
        ]);
        const teams = await teamsRes.json();
        const schedule = await scheduleRes.json();
        return { teams, schedule };
      } catch (err) {
        document.getElementById('groups-container').innerHTML = '<p class="empty">数据加载失败，请确认 data/teams.json 与 data/schedule.json 存在。</p>';
        throw err;
      }
    }

    function groupBy(array, key) {
      return array.reduce((acc, item) => {
        const k = item[key];
        (acc[k] ||= []).push(item);
        return acc;
      }, {});
    }

    function renderGroups(teams) {
      const container = document.getElementById('groups-container');
      const grouped = groupBy(teams, '组别');
      container.innerHTML = groupOrder.map(group => {
        const list = grouped[group] || [];
        return `
          <div class="group-card">
            <div class="group-header ${groupColorClass[group]}">
              <span>${group} 组</span>
              <span>${list.length} 队</span>
            </div>
            <div class="team-list">
              ${list.map(team => `
                <div class="team-item">
                  <img src="${team.logo}" alt="${team.名称}" class="team-logo" loading="lazy" />
                  <div class="team-info">
                    <div class="team-name">${team.名称}</div>
                    <div class="team-venue">${team.主场场馆}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderSchedule(schedule, teams) {
      const container = document.getElementById('schedule-container');
      const venueMap = new Map(teams.map(t => [t.名称, t.主场场馆]));
      const logoMap = new Map(teams.map(t => [t.名称, t.logo]));

      function render(filterGroup) {
        const filtered = filterGroup === 'all' ? schedule : schedule.filter(s => s.组别 === filterGroup);
        const byRound = groupBy(filtered, '轮次');
        const rounds = Object.keys(byRound).sort((a, b) => parseInt(a) - parseInt(b));

        if (rounds.length === 0) {
          container.innerHTML = '<p class="empty">该分组暂无赛程。</p>';
          return;
        }

        container.innerHTML = rounds.map(round => {
          const matches = byRound[round].sort((a, b) => a.场序 - b.场序);
          return `
            <div class="round-block">
              <div class="round-title">第 ${round} 轮</div>
              <div class="schedule-list">
                ${matches.map(match => {
                  const dateParts = match.日期.split(' ');
                  const [year, month, day] = dateParts[0].split('-');
                  return `
                    <div class="match-card">
                      <div class="match-meta">
                        <div class="day">${month}/${day}</div>
                        <div>${dateParts[1] || ''}</div>
                        <div>${match.时间}</div>
                      </div>
                      <div class="match-teams">
                        <div class="team-side home">
                          <img src="${logoMap.get(match.主场队)}" alt="" class="team-logo" />
                          <span class="team-name">${match.主场队}</span>
                        </div>
                        <span class="vs">VS</span>
                        <div class="team-side away">
                          <img src="${logoMap.get(match.客场队)}" alt="" class="team-logo" />
                          <span class="team-name">${match.客场队}</span>
                        </div>
                      </div>
                      <div class="match-detail">
                        <span>场序 ${match.场序}</span>
                        <span class="group-tag ${groupColorClass[match.组别]}">${match.组别}</span>
                        <span class="venue">${venueMap.get(match.主场队) || ''}</span>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        }).join('');
      }

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          render(btn.dataset.group);
        });
      });

      render('all');
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(tab.dataset.target).classList.add('active');
      });
    });

    loadData().then(({ teams, schedule }) => {
      renderGroups(teams);
      renderSchedule(schedule, teams);
    });
  </script>
</body>
</html>
