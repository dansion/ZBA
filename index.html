<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>浙BA 2026 · 首页</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="teams.css" />
</head>
<body class="page-index">
  <header>
    <div class="hbar">
      <h1>浙BA 2026</h1>
    </div>
  </header>

  <div class="wrap">
    <!-- 1. 今天 / 明天赛程：行样式与 schedule.html 一致（共用 .matches） -->
    <section class="card day-card">
      <div class="sec-title">今天赛程 <span class="date" id="today-date"></span></div>
      <div class="matches" id="today-list">
        <div class="msg">正在加载今天赛程…</div>
      </div>
    </section>

    <section class="card day-card">
      <div class="sec-title">明天赛程 <span class="date" id="tomorrow-date"></span></div>
      <div class="matches" id="tomorrow-list">
        <div class="msg">正在加载明天赛程…</div>
      </div>
    </section>

    <!-- 2 & 3. 入口：小组积分榜 / 订阅赛程日历 -->
    <div class="nav">
      <a class="card nav-card" href="teams.html">
        <span class="ico">🏆</span>
        <span class="t">小组积分榜</span>
        <span class="d">A / B / C / D 四组实时排名与积分</span>
        <span class="go">查看积分榜 ›</span>
      </a>
      <a class="card nav-card" href="calendar.html">
        <span class="ico">📅</span>
        <span class="t">订阅赛程日历</span>
        <span class="d">添加到手机日历，开赛自动提醒</span>
        <span class="go">订阅日历 ›</span>
      </a>
    </div>
  </div>

  <p class="footer">
    数据更新 <code>2026-09-12</code> · 浙BA 2026 浙江省城市篮球联赛
  </p>

  <script src="data/data.js"></script>
  <script>
    (function () {
      var todayList = document.getElementById('today-list');
      var tomorrowList = document.getElementById('tomorrow-list');

      function esc(s) {
        return String(s).replace(/[&<>"]/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
      }
      // 队徽改用 CSS 背景渲染（teams.css 内嵌 base64）；键为 logos/ 文件名去扩展名（如 台州）
      function logoKey(logo) {
        return String(logo || '').replace(/^.*\//, '').replace(/\.png$/, '');
      }
      function logoImg(t, name) {
        return (t && t.logo)
          ? '<span class="mlogo" data-logo="' + esc(logoKey(t.logo)) + '" aria-label="' + esc(name) + '"></span>'
          : '<span class="mlogo"></span>';
      }
      // 按比赛时间升序（日期早的在前）；同一时刻以场序稳定排序
      function byTime(a, b) {
        var ta = String(a['日期'] || '').split(' ')[0] + ' ' + (a['时间'] || '');
        var tb = String(b['日期'] || '').split(' ')[0] + ' ' + (b['时间'] || '');
        if (ta !== tb) return ta < tb ? -1 : 1;
        return a['场序'] - b['场序'];
      }

      if (typeof teamsData === 'undefined' || typeof scheduleData === 'undefined') {
        var errHtml = '<div class="msg error">数据加载失败：请确认 <code>data/data.js</code> 与本页面一并存在。</div>';
        todayList.innerHTML = errHtml;
        tomorrowList.innerHTML = errHtml;
        return;
      }

      var teamMap = {};
      teamsData.forEach(function (t) { teamMap[t['名称']] = t; });

      // 与 schedule.html 完全一致的行结构（首页赛程不针对单一球队，故不高亮）
      function renderMatches(matches) {
        return matches.map(function (m) {
          var home = teamMap[m['主场队']] || {};
          var away = teamMap[m['客场队']] || {};
          var isPlayed = m['主队得分'] != null && m['客队得分'] != null;

          var centerBottom = isPlayed
            ? '<div class="score">' + m['主队得分'] + ' : ' + m['客队得分'] + '</div>'
            : '<div class="venue">' + esc(home['主场场馆'] || '待定') + '</div>';

          var dparts = String(m['日期'] || '').split(' ');
          var dateStr = dparts[0] || '';
          var weekStr = dparts[1] || '';
          var timeStr = m['时间'] || '';

          return '<div class="match">' +
            '<div class="side home">' +
              logoImg(home, m['主场队']) +
              '<span class="mname">' + esc(m['主场队']) + '</span>' +
            '</div>' +
            '<div class="center">' +
              '<div class="when"><span class="date">' + esc(dateStr) + '</span>' +
                '<span class="time">' + esc((weekStr + ' ' + timeStr).trim()) + '</span></div>' +
              centerBottom +
            '</div>' +
            '<div class="side away">' +
              '<span class="mname">' + esc(m['客场队']) + '</span>' +
              logoImg(away, m['客场队']) +
            '</div>' +
          '</div>';
        }).join('');
      }

      // 填充某天的赛程：offset=0 今天、1 明天
      var WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      function fillDay(listEl, dateEl, offset, emptyMsg) {
        var d = new Date();
        d.setDate(d.getDate() + offset);
        var mm = String(d.getMonth() + 1); if (mm.length < 2) mm = '0' + mm;
        var dd = String(d.getDate()); if (dd.length < 2) dd = '0' + dd;
        var ymd = d.getFullYear() + '-' + mm + '-' + dd;
        dateEl.textContent = ymd + ' ' + WD[d.getDay()];

        var matches = scheduleData.filter(function (m) {
          return String(m['日期'] || '').split(' ')[0] === ymd;
        }).sort(byTime);

        listEl.innerHTML = matches.length
          ? renderMatches(matches)
          : '<div class="msg">' + emptyMsg + '</div>';
      }

      fillDay(todayList, document.getElementById('today-date'), 0,
        '今天没有比赛。<br>可从 <a href="teams.html">小组积分榜</a> 查看各队完整赛程。');
      fillDay(tomorrowList, document.getElementById('tomorrow-date'), 1,
        '明天没有比赛。');
    })();
  </script>
</body>
</html>
