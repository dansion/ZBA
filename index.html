<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>浙江篮球联赛 · 分组与赛程</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --border: #e5e7eb;
      --group-a: #ef4444;
      --group-b: #f59e0b;
      --group-c: #10b981;
      --group-d: #8b5cf6;
      --radius: 14px;
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 10px -2px rgba(0,0,0,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: white;
      padding: 10px 20px;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 70% 30%, rgba(255,255,255,0.12) 0%, transparent 40%);
      pointer-events: none;
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: relative;
      flex-wrap: wrap;
    }
    .header-title { font-size: 1.05rem; font-weight: 700; white-space: nowrap; }
    .header-title .sub { font-weight: 400; opacity: 0.85; font-size: 0.85rem; margin-left: 6px; }
    .tabs { display: flex; gap: 6px; }
    .tab {
      padding: 5px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.12);
      color: white;
      font-weight: 500;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab.active { background: white; color: var(--accent); border-color: white; }
    .tab:hover:not(.active) { background: rgba(255,255,255,0.25); }
    .section { display: none; animation: fadeIn 0.3s ease; }
    .section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .groups-row {
      display: flex;
      flex-wrap: nowrap;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .group-card {
      flex: 1 1 0;
      min-width: 230px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .group-header {
      padding: 10px 14px;
      color: white;
      font-weight: 700;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .group-header.A { background: var(--group-a); }
    .group-header.B { background: var(--group-b); }
    .group-header.C { background: var(--group-c); }
    .group-header.D { background: var(--group-d); }
    .team-list { padding: 6px; }
    .team-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      border-radius: 10px;
      transition: background 0.15s ease;
    }
    .team-item:hover { background: #f9fafb; }
    .team-logo {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      object-fit: contain;
      background: white;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.05);
      padding: 2px;
      flex-shrink: 0;
    }
    .team-info { flex: 1; min-width: 0; }
    .team-name { font-weight: 600; font-size: 0.88rem; }
    .team-venue { font-size: 0.7rem; color: var(--muted); margin-top: 1px; }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .filter-mode {
      display: inline-flex;
      background: #eef1f4;
      border-radius: 999px;
      padding: 3px;
    }
    .mode-btn {
      padding: 5px 14px;
      border: none;
      background: transparent;
      border-radius: 999px;
      font-size: 0.82rem;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .mode-btn.active { background: white; color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
    .filter-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .filter-controls.hidden { display: none; }
    .filter-label { color: var(--muted); font-size: 0.85rem; }
    .filter-btn {
      padding: 5px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: white;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .filter-btn.active { background: var(--text); color: white; border-color: var(--text); }
    .filter-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
    .team-select {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: white;
      font-size: 0.85rem;
      font-family: inherit;
      cursor: pointer;
      max-width: 220px;
    }
    .team-select:focus { outline: none; border-color: var(--accent); }

    .round-block { margin-bottom: 18px; }
    .round-title {
      font-size: 1rem;
      font-weight: 700;
      margin: 10px 0 8px;
      padding-left: 10px;
      border-left: 4px solid var(--accent);
    }
    .schedule-list { display: grid; gap: 8px; }
    .match-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 10px 14px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 14px;
    }
    .match-meta {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      min-width: 64px;
    }
    .match-meta .day { font-size: 0.95rem; font-weight: 700; color: var(--text); }
    .match-teams {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }
    .team-side {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }
    .team-side.away { justify-content: flex-end; flex-direction: row-reverse; text-align: right; }
    .team-side .team-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.9rem; }
    .vs {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      background: var(--bg);
      padding: 3px 8px;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .match-detail {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: right;
      min-width: 110px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }
    .match-detail .venue { color: var(--text); font-weight: 500; }
    .group-tag {
      display: inline-block;
      width: 20px;
      height: 20px;
      line-height: 20px;
      border-radius: 50%;
      text-align: center;
      font-size: 0.65rem;
      font-weight: 700;
      color: white;
    }
    .group-tag.A { background: var(--group-a); }
    .group-tag.B { background: var(--group-b); }
    .group-tag.C { background: var(--group-c); }
    .group-tag.D { background: var(--group-d); }

    .empty { text-align: center; color: var(--muted); padding: 36px 0; }

    @media (max-width: 720px) {
      .match-card { grid-template-columns: 1fr; gap: 8px; }
      .match-meta { text-align: left; display: flex; gap: 10px; align-items: baseline; }
      .match-detail { text-align: left; align-items: flex-start; }
      .team-side.away { flex-direction: row; text-align: left; }
      .header-title { font-size: 0.95rem; }
      .group-card { min-width: 200px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="header-title">浙江篮球联赛<span class="sub">2026 赛季</span></div>
      <div class="tabs">
        <button class="tab active" data-target="groups">分组情况</button>
        <button class="tab" data-target="schedule">赛程安排</button>
      </div>
    </div>
  </header>

  <div class="container">
    <section id="groups" class="section active">
      <div id="groups-container" class="groups-row"></div>
    </section>

    <section id="schedule" class="section">
      <div class="filter-bar">
        <div class="filter-mode">
          <button class="mode-btn active" data-mode="group">按组别</button>
          <button class="mode-btn" data-mode="team">按队伍</button>
        </div>
        <div class="filter-controls" id="group-filters">
          <button class="filter-btn active" data-group="all">全部</button>
          <button class="filter-btn" data-group="A">A组</button>
          <button class="filter-btn" data-group="B">B组</button>
          <button class="filter-btn" data-group="C">C组</button>
          <button class="filter-btn" data-group="D">D组</button>
        </div>
        <div class="filter-controls hidden" id="team-filters">
          <select class="team-select" id="team-select"></select>
        </div>
      </div>
      <div id="schedule-container"></div>
    </section>
  </div>

  <script src="data/data.js"></script>
  <script>
    const groupOrder = ['A', 'B', 'C', 'D'];
    const groupColorClass = { A: 'A', B: 'B', C: 'C', D: 'D' };

    function groupBy(array, key) {
      return array.reduce((acc, item) => {
        const k = item[key];
        (acc[k] ||= []).push(item);
        return acc;
      }, {});
    }

    function renderGroups(teams) {
      const container = document.getElementById('groups-container');
      const grouped = groupBy(teams, '组别');
      container.innerHTML = groupOrder.map(group => {
        const list = grouped[group] || [];
        return `
          <div class="group-card">
            <div class="group-header ${groupColorClass[group]}">
              <span>${group} 组</span>
              <span>${list.length} 队</span>
            </div>
            <div class="team-list">
              ${list.map(team => `
                <div class="team-item">
                  <img src="${team.logo}" alt="${team.名称}" class="team-logo" loading="lazy" />
                  <div class="team-info">
                    <div class="team-name">${team.名称}</div>
                    <div class="team-venue">${team.主场场馆}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderSchedule(schedule, teams) {
      const container = document.getElementById('schedule-container');
      const venueMap = new Map(teams.map(t => [t.名称, t.主场场馆]));
      const logoMap = new Map(teams.map(t => [t.名称, t.logo]));

      const teamSelect = document.getElementById('team-select');
      const sortedTeams = [...teams].sort((a, b) => a.名称.localeCompare(b.名称, 'zh'));
      teamSelect.innerHTML = '<option value="all">全部队伍</option>' +
        sortedTeams.map(t => `<option value="${t.名称}">${t.名称}</option>`).join('');

      let currentMode = 'group';
      let currentGroup = 'all';
      let currentTeam = 'all';

      function render() {
        let filtered = schedule;
        if (currentMode === 'group' && currentGroup !== 'all') {
          filtered = filtered.filter(s => s.组别 === currentGroup);
        } else if (currentMode === 'team' && currentTeam !== 'all') {
          filtered = filtered.filter(s => s.主场队 === currentTeam || s.客场队 === currentTeam);
        }

        const byRound = groupBy(filtered, '轮次');
        const rounds = Object.keys(byRound).sort((a, b) => parseInt(a) - parseInt(b));

        if (rounds.length === 0) {
          container.innerHTML = '<p class="empty">该条件下暂无赛程。</p>';
          return;
        }

        container.innerHTML = rounds.map(round => {
          const matches = byRound[round].sort((a, b) => a.场序 - b.场序);
          return `
            <div class="round-block">
              <div class="round-title">第 ${round} 轮</div>
              <div class="schedule-list">
                ${matches.map(match => {
                  const dateParts = match.日期.split(' ');
                  const [year, month, day] = dateParts[0].split('-');
                  return `
                    <div class="match-card">
                      <div class="match-meta">
                        <div class="day">${month}/${day}</div>
                        <div>${dateParts[1] || ''}</div>
                        <div>${match.时间}</div>
                      </div>
                      <div class="match-teams">
                        <div class="team-side home">
                          <img src="${logoMap.get(match.主场队)}" alt="" class="team-logo" />
                          <span class="team-name">${match.主场队}</span>
                        </div>
                        <span class="vs">VS</span>
                        <div class="team-side away">
                          <img src="${logoMap.get(match.客场队)}" alt="" class="team-logo" />
                          <span class="team-name">${match.客场队}</span>
                        </div>
                      </div>
                      <div class="match-detail">
                        <span>场序 ${match.场序} <span class="group-tag ${groupColorClass[match.组别]}">${match.组别}</span></span>
                        <span class="venue">${venueMap.get(match.主场队) || ''}</span>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        }).join('');
      }

      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentMode = btn.dataset.mode;
          document.getElementById('group-filters').classList.toggle('hidden', currentMode !== 'group');
          document.getElementById('team-filters').classList.toggle('hidden', currentMode !== 'team');
          render();
        });
      });

      document.querySelectorAll('#group-filters .filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#group-filters .filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentGroup = btn.dataset.group;
          render();
        });
      });

      teamSelect.addEventListener('change', () => {
        currentTeam = teamSelect.value;
        render();
      });

      render();
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(tab.dataset.target).classList.add('active');
      });
    });

    renderGroups(teamsData);
    renderSchedule(scheduleData, teamsData);
  </script>
</body>
</html>
