<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>浙BA 2026 · 首页</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="teams.css" />
</head>
<body class="page-index">
  <header>
    <div class="hbar">
      <h1>浙BA 2026</h1>
    </div>
  </header>

  <div class="wrap">
    <!-- 首页赛程：按「比赛日」动态展示 前序赛程 / 即将开赛 / (明天)后续赛程 -->
    <section class="card day-card" id="prev-card">
      <div class="sec-title" role="button" tabindex="0" aria-controls="prev-list"><span id="prev-title">前序赛程</span> <span class="date" id="prev-date"></span><span class="caret" aria-hidden="true"></span></div>
      <div class="matches" id="prev-list">
        <div class="msg">正在加载前序赛程…</div>
      </div>
    </section>

    <section class="card day-card" id="upcoming-card">
      <div class="sec-title" role="button" tabindex="0" aria-controls="upcoming-list"><span id="upcoming-title">即将开赛</span> <span class="date" id="upcoming-date"></span><span class="caret" aria-hidden="true"></span></div>
      <div class="matches" id="upcoming-list">
        <div class="msg">正在加载即将开赛…</div>
      </div>
    </section>

    <section class="card day-card" id="next-card">
      <div class="sec-title" role="button" tabindex="0" aria-controls="next-list"><span id="next-title">明天赛程</span> <span class="date" id="next-date"></span><span class="caret" aria-hidden="true"></span></div>
      <div class="matches" id="next-list">
        <div class="msg">正在加载明天赛程…</div>
      </div>
    </section>

    <!-- 2 & 3. 入口：小组积分榜 / 订阅赛程日历 -->
    <div class="nav">
      <a class="card nav-card" href="teams.html">
        <span class="ico">🏆</span>
        <span class="t">小组积分榜</span>
        <span class="d">A / B / C / D 四组实时排名与积分</span>
        <span class="go">查看积分榜 ›</span>
      </a>
      <a class="card nav-card" href="calendar.html">
        <span class="ico">📅</span>
        <span class="t">订阅赛程日历</span>
        <span class="d">添加到手机日历，开赛自动提醒</span>
        <span class="go">订阅日历 ›</span>
      </a>
    </div>
  </div>

  <p class="footer">
    数据更新 <code id="data-date">2026-09-19</code> · 浙BA 2026 浙江省城市篮球联赛
  </p>

  <script src="data/data.js"></script>
  <script>
    // 页角「数据更新」日期取 data.js 中最新一个有比分的比赛日期
    (function () {
      var el = document.getElementById('data-date');
      if (!el || typeof scheduleData === 'undefined') return;
      var latest = '';
      scheduleData.forEach(function (m) {
        if (m['主队得分'] == null || m['客队得分'] == null) return;
        var d = String(m['日期'] || '').slice(0, 10);
        if (d > latest) latest = d;
      });
      if (latest) el.textContent = latest;
    })();
  </script>
  <script>
    (function () {
      function esc(s) {
        return String(s).replace(/[&<>"]/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
      }
      // 队徽改用 CSS 背景渲染（teams.css 内嵌 base64）；键为 logos/ 文件名去扩展名（如 台州）
      function logoKey(logo) {
        return String(logo || '').replace(/^.*\//, '').replace(/\.png$/, '');
      }
      function logoImg(t, name) {
        return (t && t.logo)
          ? '<span class="mlogo" data-logo="' + esc(logoKey(t.logo)) + '" aria-label="' + esc(name) + '"></span>'
          : '<span class="mlogo"></span>';
      }
      // 按比赛时间升序（日期早的在前）；同一时刻以场序稳定排序
      function byTime(a, b) {
        var ta = String(a['日期'] || '').split(' ')[0] + ' ' + (a['时间'] || '');
        var tb = String(b['日期'] || '').split(' ')[0] + ' ' + (b['时间'] || '');
        if (ta !== tb) return ta < tb ? -1 : 1;
        return a['场序'] - b['场序'];
      }

      if (typeof teamsData === 'undefined' || typeof scheduleData === 'undefined') {
        var errHtml = '<div class="msg error">数据加载失败：请确认 <code>data/data.js</code> 与本页面一并存在。</div>';
        ['prev-list', 'upcoming-list', 'next-list'].forEach(function (id) {
          var el = document.getElementById(id); if (el) el.innerHTML = errHtml;
        });
        return;
      }

      var teamMap = {};
      teamsData.forEach(function (t) { teamMap[t['名称']] = t; });

      // 与 schedule.html 完全一致的行结构（首页赛程不针对单一球队，故不高亮）
      function renderMatches(matches) {
        return matches.map(function (m) {
          var home = teamMap[m['主场队']] || {};
          var away = teamMap[m['客场队']] || {};
          var isPlayed = m['主队得分'] != null && m['客队得分'] != null;

          var centerBottom = isPlayed
            ? '<div class="score">' + m['主队得分'] + ' : ' + m['客队得分'] + '</div>'
            : '<div class="venue">' + esc(home['主场场馆'] || '待定') + '</div>';

          var dparts = String(m['日期'] || '').split(' ');
          var dateStr = dparts[0] || '';
          var weekStr = dparts[1] || '';
          var timeStr = m['时间'] || '';

          return '<div class="match">' +
            '<div class="side home">' +
              logoImg(home, m['主场队']) +
              '<span class="mname">' + esc(m['主场队']) + '</span>' +
            '</div>' +
            '<div class="center">' +
              '<div class="when"><span class="date">' + esc(dateStr) + '</span>' +
                '<span class="time">' + esc((weekStr + ' ' + timeStr).trim()) + '</span></div>' +
              centerBottom +
            '</div>' +
            '<div class="side away">' +
              '<span class="mname">' + esc(m['客场队']) + '</span>' +
              logoImg(away, m['客场队']) +
            '</div>' +
          '</div>';
        }).join('');
      }

      // ---- 按「比赛日」动态计算 前序 / 即将开赛 / 明天 ----
      var WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

      function pad(n) { return n < 10 ? '0' + n : '' + n; }
      function fmt(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
      function addDays(base, n) { var d = new Date(base); d.setDate(d.getDate() + n); return d; }
      function dayOf(m) { return String(m['日期'] || '').split(' ')[0]; }
      function weekOfYmd(ymd) {
        var p = ymd.split('-');
        var d = new Date(+p[0], +p[1] - 1, +p[2]);
        return WD[d.getDay()];
      }

      var now = new Date();
      var todayStr = fmt(now);
      var tomorrowStr = fmt(addDays(now, 1));
      var yesterdayStr = fmt(addDays(now, -1));
      var dbyStr = fmt(addDays(now, -2));

      // 是否已赛（有比分即已赛）；同一比赛日要么全赛要么未赛，不存在跨时段
      function isPlayed(m) { return m['主队得分'] != null && m['客队得分'] != null; }
      function matchesOn(day) {
        if (!day) return [];
        return scheduleData.filter(function (m) { return dayOf(m) === day; }).sort(byTime);
      }
      function dayPlayed(day) {
        var ms = matchesOn(day);
        return ms.length > 0 && ms.every(function (m) { return isPlayed(m); });
      }

      // 收集全部比赛日并升序（yyyy-mm-dd 定宽，字典序即时间序）
      var daySet = {};
      scheduleData.forEach(function (m) { var d = dayOf(m); if (d) daySet[d] = true; });
      var allDays = Object.keys(daySet).sort();

      // 即将开赛 = 今天或之后、最早的「未赛」比赛日；若全部已赛则无即将开赛
      var upcomingDay = null, prevDay = null, nextDay = null;
      for (var i = 0; i < allDays.length; i++) {
        if (allDays[i] >= todayStr && !dayPlayed(allDays[i])) { upcomingDay = allDays[i]; break; }
      }
      // 前序赛程 = 即将开赛之前最近的「已出比分」比赛日（今天若已赛，则今天归入前序）
      var prevBound = upcomingDay || '9999-12-31';
      for (var j = allDays.length - 1; j >= 0; j--) {
        if (allDays[j] < prevBound && dayPlayed(allDays[j])) { prevDay = allDays[j]; break; }
      }
      // 明天预览 = 即将开赛之后的下一个比赛日
      if (upcomingDay) {
        for (var k = 0; k < allDays.length; k++) {
          if (allDays[k] > upcomingDay) { nextDay = allDays[k]; break; }
        }
      }

      // 相对今天的口语标签；更早或更晚则回退到具体日期
      function relLabel(day) {
        if (day === todayStr) return '今天';
        if (day === tomorrowStr) return '明天';
        if (day === yesterdayStr) return '昨天';
        if (day === dbyStr) return '前天';
        return day;
      }

      // 折叠状态：.collapsed 类控制 .matches 显隐，并同步 aria-expanded
      function setCollapsed(card, collapsed) {
        card.classList.toggle('collapsed', !!collapsed);
        var title = card.querySelector('.sec-title');
        if (title) title.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      }

      // 点击 / 键盘（Enter、空格）标题部分收起或展开对应卡片
      Array.prototype.forEach.call(
        document.querySelectorAll('.page-index .day-card .sec-title'),
        function (title) {
          function toggle() {
            var card = title.closest('.day-card');
            if (card) setCollapsed(card, !card.classList.contains('collapsed'));
          }
          title.addEventListener('click', toggle);
          title.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
              e.preventDefault(); toggle();
            }
          });
        }
      );

      // collapsed 参数：该板块展示时的默认收起状态（false = 展开）
      function fillSection(cardId, titleId, dateId, listId, baseLabel, day, emptyMsg, collapsed) {
        var card = document.getElementById(cardId);
        if (!day) { card.style.display = 'none'; return; }
        card.style.display = '';
        document.getElementById(titleId).textContent = baseLabel + '（' + relLabel(day) + '）';
        document.getElementById(dateId).textContent = day + ' ' + weekOfYmd(day);
        var matches = matchesOn(day);
        document.getElementById(listId).innerHTML = matches.length
          ? renderMatches(matches)
          : '<div class="msg">' + emptyMsg + '</div>';
        setCollapsed(card, collapsed);
      }

      // 1. 前序赛程（即将开赛之前最近的已出比分比赛日；今天已赛则今天归此）——默认展开
      fillSection('prev-card', 'prev-title', 'prev-date', 'prev-list',
        '前序赛程', prevDay, '暂无已赛比赛。', false);

      // 2. 即将开赛（今天或之后最近的未赛比赛日；全部已赛则隐藏）——默认展开
      fillSection('upcoming-card', 'upcoming-title', 'upcoming-date', 'upcoming-list',
        '即将开赛', upcomingDay, '本赛季比赛已全部结束。', false);

      // 3. 明天/后续赛程：仅当「即将开赛」落在今天（即连续两个比赛日都有比赛）时显示，
      //    且默认收起；否则隐藏整个板块
      var nextCard = document.getElementById('next-card');
      if (upcomingDay === todayStr && nextDay) {
        var baseNext = (nextDay === tomorrowStr) ? '明天赛程' : '后续赛程';
        fillSection('next-card', 'next-title', 'next-date', 'next-list',
          baseNext, nextDay, '该日没有比赛。', true);
      } else {
        nextCard.style.display = 'none';
      }
    })();
  </script>
</body>
</html>
